<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MiniYuxi · 专家市场</title>
<style>
  :root { --bg:#f6f8fb; --panel:#fff; --line:#e3e8ef; --ink:#1f2733; --muted:#6b7686; --accent:#3370ff; --accent-soft:#eaf1ff; --shadow:0 2px 10px rgba(20,30,50,.08); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color: var(--ink); background: var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow); position:sticky; top:0; z-index:5; }
  header .title { font-weight:700; font-size:16px; }
  header input { flex:1; max-width:360px; border:1px solid var(--line); border-radius:8px; padding:8px 11px; font-size:13px; }
  header .spacer { flex:1; }
  #cats { display:flex; gap:8px; padding:12px 18px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 13px; font-size:12px; cursor:pointer; color:var(--muted); }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { padding:6px 18px 40px; display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; align-content:start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px; box-shadow:var(--shadow); cursor:pointer; transition:.15s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card .top { display:flex; align-items:center; gap:10px; }
  .card .ic { font-size:26px; }
  .card .nm { font-weight:700; font-size:15px; }
  .card .ver { margin-left:auto; font-size:11px; color:var(--muted); }
  .card .desc { color:var(--muted); font-size:13px; margin:9px 0; line-height:1.5; min-height:38px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px; margin-right:6px; }
  .b-cat { background:var(--accent-soft); color:var(--accent); }
  .b-risk-low { background:#e7f6ec; color:#16a34a; } .b-risk-medium { background:#fff3e0; color:#f59e0b; } .b-risk-high { background:#fde8ef; color:#e11d48; }
  .tag { display:inline-block; font-size:11px; color:var(--muted); background:#f1f4f9; border-radius:5px; padding:2px 7px; margin:3px 4px 0 0; }
  #detail { position:fixed; right:0; top:0; width:380px; height:100vh; background:var(--panel); border-left:1px solid var(--line); box-shadow:-4px 0 18px rgba(20,30,50,.1); padding:22px; overflow:auto; transform:translateX(110%); transition:.22s; }
  #detail.open { transform:translateX(0); }
  #detail h3 { margin:6px 0 4px; font-size:18px; }
  #detail .close { position:absolute; right:14px; top:14px; cursor:pointer; color:var(--muted); font-size:20px; }
  #detail .row { margin:10px 0; font-size:13px; line-height:1.6; }
  #detail .k { color:var(--muted); font-size:12px; display:block; margin-bottom:3px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#1f2733; color:#fff; padding:9px 16px; border-radius:9px; font-size:13px; opacity:0; transition:.25s; z-index:99; }
  #toast.show { opacity:.96; }
  .empty { color:var(--muted); padding:40px; text-align:center; width:100%; }
</style>
</head>
<body>
<header>
  <span class="title">🧩 专家市场</span>
  <input id="search" placeholder="搜索专家 / 关键词 / 分类…" />
  <span class="spacer"></span>
  <span id="status" style="font-size:12px;color:var(--muted)"></span>
</header>
<div id="cats"></div>
<main id="grid"></main>
<div id="detail"><span class="close" id="dClose">×</span><div id="dBody"></div></div>
<div id="toast"></div>
<script src="experts-market.js"></script>
</body>
</html>

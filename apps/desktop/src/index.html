<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniYuxi 桌面版</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    这一页只是「启动壳」：Tauri 拉起 Python sidecar（现有内核 api.py + core/），
    拿到 READY 契约里的 url + token 后，把窗口直接导航到 http://127.0.0.1:<port>，
    之后看到的界面就是 Web 端那一份 web/index.html，业务逻辑零重复。
    下面的界面只在「内核还没起来 / 起不来」时可见。
  -->
  <main class="shell">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <rect x="2" y="2" width="60" height="60" rx="16" fill="#2563eb"></rect>
        <path d="M16 44V20l16 16 16-16v24" fill="none" stroke="#fff" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </div>
    <h1>MiniYuxi 桌面版</h1>
    <p class="sub">本地优先 · 内核常驻 · 数据不出本机</p>

    <div class="status" id="status">
      <span class="dot" id="dot"></span>
      <span id="phase">正在启动内核…</span>
    </div>
    <div class="bar"><i id="bar"></i></div>

    <details class="log" id="logWrap" hidden>
      <summary>内核日志</summary>
      <pre id="log"></pre>
    </details>

    <div class="actions">
      <button id="btnRestart" type="button">重启内核</button>
      <button id="btnData" type="button" class="ghost">打开数据目录</button>
    </div>
    <p class="meta" id="meta"></p>
  </main>
  <script src="./main.js"></script>
</body>
</html>

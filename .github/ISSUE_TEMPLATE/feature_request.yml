name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个需求来自什么痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么实现？
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options: ["Web 端", "Desktop 端", "CLI 端", "core 内核", "文档", "其他"]
    validations:
      required: true

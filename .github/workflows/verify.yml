name: Verify (pre-merge gate)

# 合并硬闸门（360 七坑 · 坑3 一键生成防护）：
# PR 或推送到 main 时自动跑，任一卡点未过即标红、阻止合并。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest

      - name: Scan undefined symbols (frontend regression guard)
        run: python tests/_scan_undef.py

      - name: Citation gate unit test (legal/labor no-fabrication)
        run: python tests/_verify_citation_gate.py

      - name: Skill install + video generation test (T6 closed loop)
        run: python tests/_verify_skill_install_and_video.py

      - name: Skill tools test (install/uninstall from chat)
        run: python tests/_verify_skill_tools.py

      # HTTP 级：真的把「npx skills add … --skill …」发给 /api/chat，验技能落盘（自起服务、自选空闲端口）
      - name: Chat-driven skill install e2e (HTTP level)
        run: python tests/_e2e_chat_skill_install.py

      # 桌面端 sidecar 只跑单元：端到端 tour 依赖 PyInstaller 产物（Windows 专属），放 Linux CI 会假红
      - name: Desktop sidecar unit test (token ttl)
        run: python tests/test_desktop_sidecar.py --unit-only

      - name: Route smoke test (frontend acceptance)
        run: python tests/_smoke_routes.py

      - name: Self-test (expect 20/20)
        run: python tests/selftest.py

      - name: Hermes landing tests
        run: python -m pytest tests/test_hermes_landing.py -q

      - name: Perf optimization tests
        run: python -m pytest tests/test_perf_optimizations.py -q

      # —— 企业级「可商用 / 分发件与内核一致」硬闸门 ——
      - name: Version consistency gate (anti version-drift)
        run: python scripts/check_version_consistency.py --quiet

      - name: Commercial license audit (npm deps of office-bundle)
        run: |
          cd tools/office-bundle && npm ci
          cd ../..
          python scripts/audit_licenses.py --pkg tools/office-bundle --quiet

  # 桌面端实际分发件（Windows .exe sidecar）的冻结产物校验。
  # 必须跑在 Windows runner：sidecar 是 PyInstaller 打的 Windows PE，
  # 且 Tauri externalBin 仅 Windows 平台，Linux CI 跑会假红。
  build-sidecar:
    runs-on: windows-latest
    env:
      # Windows runner 的 stdout 默认 cp1252：脚本里的中文 print 会触发
      # UnicodeEncodeError、0 秒即崩（2026-10-23 修复，连挂 17 次的根因）。
      # 脚本入口已 reconfigure UTF-8，这里再兜一层底。
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # web/vendor/univer/* 是 office-bundle 的构建产物、被 .gitignore 忽略，checkout 里没有。
      # 不先构建 → PyInstaller 收不进 univer.worker.js → 公式引擎 Worker 缺失
      # （主线程 preset 会把 notExecuteFormula 置 true，SUM/AVG 不求值）+ 冻结产物校验 MISS。
      - name: Build office bundle (univer vendor assets)
        run: |
          cd tools/office-bundle
          npm ci
          npm run build
          cd ../..

      - name: Build Windows sidecar (PyInstaller -> Tauri externalBin)
        run: python scripts/build_sidecar.py

      - name: Verify frozen sidecar contents
        run: python scripts/verify_sidecar_contents.py

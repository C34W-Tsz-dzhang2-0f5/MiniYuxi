name: Verify (pre-merge gate)

# 合并硬闸门（360 七坑 · 坑3 一键生成防护）：
# PR 或推送到 main 时自动跑，任一卡点未过即标红、阻止合并。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Scan undefined symbols (frontend regression guard)
        run: python tests/_scan_undef.py

      - name: Citation gate unit test (legal/labor no-fabrication)
        run: python tests/_verify_citation_gate.py

      - name: Route smoke test (frontend acceptance)
        run: python tests/_smoke_routes.py
